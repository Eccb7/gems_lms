# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: gems_lms_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: gems_lms_test

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: gems_lms_production
    username: gems_lms
    password: <%= ENV["GEMS_LMS_DATABASE_PASSWORD"] %>
  cache:
    <<: *default
    database: gems_lms_production_cache
    username: gems_lms
    password: <%= ENV["GEMS_LMS_DATABASE_PASSWORD"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: gems_lms_production_queue
    username: gems_lms
    password: <%= ENV["GEMS_LMS_DATABASE_PASSWORD"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: gems_lms_production_cable
    username: gems_lms
    password: <%= ENV["GEMS_LMS_DATABASE_PASSWORD"] %>
    migrations_paths: db/cable_migrate
